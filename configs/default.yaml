seed: 2027
data:
  history_steps: 8
  action_candidates: 8
  action_steps: 32
  future_steps: 8
  scene_points: 512
  robot_points: 128
  candidate_views: 8
  image_resolution: 256
  point_feature_dim: 1
  robot_state_dim: 16
  task_embedding_dim: 32
model:
  hidden_dim: 512
  layers: 6
  heads: 8
  dropout: 0.1
  ensemble_members: 3
train:
  amp: true
  freeze_backbone: true
  batch_size: 2
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip: 1.0
  loss_weights:
    flow: 1.0
    contact: 1.0
    spatial_collision: 2.0
    success: 2.0
    collision: 2.0
    ranking: 0.5
active_view:
  risk_threshold: 0.35
  max_observations: 2
  camera_cost_weight: 0.05
  camera_safety_weight: 1.0
  failure_weight: 1.0
  collision_weight: 1.0
  confidence_z: 1.645
